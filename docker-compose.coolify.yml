# Compose para desplegar en Coolify (staging paper-trading) — completo y
# autocontenido, NO se combina con docker-compose.yml ni con
# docker-compose.staging.yml (misma razón que documenta el encabezado de
# docker-compose.staging.yml: cero ambigüedad de merge entre versiones de
# Compose).
#
# Diferencias deliberadas contra docker-compose.yml (dev local):
#
# 1. Sin `ports:` hacia el host. En el VPS de Coolify el puerto 8000 ya lo
#    ocupa el propio Coolify, y publicar en 127.0.0.1 no sirve detrás de su
#    proxy. La exposición se hace vía Traefik (el proxy de Coolify) con los
#    labels de `swarm` — dominio en ${SWARM_DOMAIN} y, como el dashboard no
#    tiene autenticación propia y /swarm/halt es un POST abierto, Basic Auth
#    obligatorio en ${SWARM_BASIC_AUTH} (formato htpasswd, p. ej.
#    `openssl passwd -apr1` — el compose se niega a arrancar sin ambas).
# 2. Sin `redis`: ningún código de la app lo usa todavía (Fase 5 del
#    ARCHITECTURE_REVIEW). Se agrega aquí cuando esa fase aterrice.
# 3. `migrate` sigue siendo gate de arranque de `swarm`
#    (service_completed_successfully), igual que en dev — Coolify solo hace
#    `docker compose up`, así que el orden lo garantiza este archivo.
#
# Variables requeridas (se configuran en Coolify → Environment Variables):
#   POSTGRES_PASSWORD  — sin default, igual que en los otros compose
#   SWARM_BASIC_AUTH   — usuario:hash htpasswd para el dashboard
#                        (`openssl passwd -apr1`; el dominio ya no es variable,
#                        va hardcodeado en las labels — ver nota ahí)
#   APP_ENV            — paper (default aquí; nunca `live` en este stack:
#                        este despliegue corre el broker simulado)

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-swarm_trading}
      POSTGRES_USER: ${POSTGRES_USER:-swarm}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-swarm} -d ${POSTGRES_DB:-swarm_trading}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - swarm_net
    logging: *default-logging
    # Sin mapeo de puerto al host y fuera de la red del proxy — solo
    # migrate/swarm en swarm_net pueden alcanzarlo.

  migrate:
    # Sin `build:` a propósito: si migrate y swarm construyen los dos el mismo
    # tag, BuildKit los exporta en paralelo y el deploy muere con
    # `image "swarm-trading:coolify": already exists`. Solo swarm construye;
    # migrate reutiliza la imagen ya construida.
    image: swarm-trading:coolify
    # Explícito porque Coolify inyecta una política de restart a los servicios
    # que no declaran una: sin esto, el one-shot de alembic se re-ejecuta en
    # bucle, service_completed_successfully nunca se cumple y swarm jamás
    # arranca (el deploy se queda colgado esperando el healthcheck).
    restart: "no"
    environment:
      APP_ENV: ${APP_ENV:-paper}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-swarm}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-swarm_trading}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - swarm_net
    entrypoint: ["alembic", "upgrade", "head"]
    logging: *default-logging

  swarm:
    build: .
    image: swarm-trading:coolify
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-paper}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-swarm}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-swarm_trading}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      # Liveness únicamente (/health, nunca /health/ready) — ver ADR-0009.
      test: ["CMD", "python", "-c", "import urllib.request as u,sys; sys.exit(0 if u.urlopen('http://localhost:8000/health', timeout=3).status == 200 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - swarm_net
      - coolify
    labels:
      # Router propio con nombre determinista, en vez del que generaría
      # Coolify al asignar dominio en su UI: así el Basic Auth queda definido
      # en este archivo versionado y no puede existir una ruta pública sin él.
      # En Coolify NO se asigna dominio a este servicio — Traefik lee estos
      # labels directamente.
      #
      # OJO con la interpolación aquí: el parser de compose de Coolify escapa
      # TODO `$...` de las labels (tanto `${VAR}` como `$VAR`) a `$$...`
      # literal, así que referenciar variables de entorno en labels es
      # imposible — ambas formas llegan a Traefik sin interpolar. El dominio va
      # hardcodeado (es público) y el hash htpasswd va inline crudo: el escape
      # de Coolify (`$apr1` → `$$apr1`) es justo lo que compose necesita para
      # entregarle a Traefik los `$` literales. La contraseña detrás del hash
      # es aleatoria de 20 caracteres — md5crypt no es crackeable a esa
      # entropía aunque este repo sea público. Para rotarla:
      #   openssl passwd -apr1 '<nueva>'  → reemplazar el hash aquí.
      - traefik.enable=true
      # Imprescindible con un contenedor en varias redes: sin esto Traefik
      # elige una IP arbitraria del contenedor y a veces cae en swarm_net (que
      # no comparte con él) — los requests se cuelgan hasta timeout de forma
      # intermitente entre deploys.
      - traefik.docker.network=coolify
      - traefik.http.middlewares.swarm-trading-auth.basicauth.users=aova:$apr1$tj37LbEr$xeycMPfkR1i/H558SyuFK0
      - traefik.http.middlewares.swarm-trading-redirect.redirectscheme.scheme=https
      - traefik.http.routers.swarm-trading-http.rule=Host(`swarm.aova.mx`)
      - traefik.http.routers.swarm-trading-http.entryPoints=http
      - traefik.http.routers.swarm-trading-http.middlewares=swarm-trading-redirect
      - traefik.http.routers.swarm-trading-https.rule=Host(`swarm.aova.mx`)
      - traefik.http.routers.swarm-trading-https.entryPoints=https
      - traefik.http.routers.swarm-trading-https.tls=true
      - traefik.http.routers.swarm-trading-https.tls.certresolver=letsencrypt
      - traefik.http.routers.swarm-trading-https.middlewares=swarm-trading-auth
      - traefik.http.routers.swarm-trading-https.service=swarm-trading
      - traefik.http.services.swarm-trading.loadbalancer.server.port=8000
    logging: *default-logging

volumes:
  postgres_data:

networks:
  swarm_net:
  # Red del proxy de Coolify (Traefik) — ya existe en el VPS.
  coolify:
    external: true
